spring.application.name=mhm-store-api
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mhm_store}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Configura una clave Base64 de al menos 32 bytes en todos los entornos.
security.jwt.secret=${JWT_SECRET_BASE64:}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Bootstrap opcional del administrador/trabajador inicial; no guardar credenciales en Git.
security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
security.bootstrap-worker.email=${BOOTSTRAP_WORKER_EMAIL:}
security.bootstrap-worker.password=${BOOTSTRAP_WORKER_PASSWORD:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
