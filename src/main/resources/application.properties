
spring.application.name=mhm-store-api

spring.datasource.url=jdbc:mysql://localhost:3306/mhm_store
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Seguridad JWT: configurar JWT_SECRET_BASE64 en el entorno antes de iniciar.
security.jwt.secret=${JWT_SECRET_BASE64:}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Bootstrap opcional del administrador inicial; no guardar credenciales en Git.
security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
security.bootstrap-worker.email=${BOOTSTRAP_WORKER_EMAIL:}
security.bootstrap-worker.password=${BOOTSTRAP_WORKER_PASSWORD:}
